<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Passwords — PTS Canada</title>
<style>
  :root {
    --bg: #f7f4ef; --surface: #ffffff; --border: #e0d9d0;
    --text: #2c2825; --muted: #8a8078; --accent: #4f86c6;
    --danger: #c0392b; --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: var(--surface); border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); padding: 36px 40px; width: 100%; max-width: 420px; }
  h1 { font-size: 1.2rem; margin-bottom: 6px; }
  .sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 28px; }
  .section { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  .section:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  label { display: block; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.95rem; background: var(--bg); color: var(--text); margin-bottom: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 20px; border-radius: var(--radius); border: none; cursor: pointer; font-size: 0.875rem; font-weight: 600; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .msg { font-size: 0.82rem; min-height: 20px; margin-top: 6px; }
  .back { display: block; text-align: center; margin-top: 20px; font-size: 0.82rem; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--accent); }
  #auth-screen { display: block; }
  #pw-screen { display: none; }
</style>
</head>
<body>

<!-- Step 1: Admin login -->
<div class="card" id="auth-screen">
  <h1>🔐 Password Settings</h1>
  <p class="sub">Enter your admin password to continue.</p>
  <div class="section">
    <label>Admin Password</label>
    <input type="password" id="auth-pw" placeholder="Admin password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()">
    <button class="btn btn-primary" onclick="doAuth()">Continue</button>
    <div class="msg" id="auth-err" style="color:var(--danger);"></div>
  </div>
  <a href="/" class="back">← Back to planner</a>
</div>

<!-- Step 2: Change passwords -->
<div class="card" id="pw-screen">
  <h1>🔐 Password Settings</h1>
  <p class="sub">Update the app or admin password below.</p>

  <div class="section">
    <label>App Password <span style="font-weight:400;text-transform:none;">(shared by the whole team)</span></label>
    <input type="password" id="new-app-pw" placeholder="New app password" autocomplete="new-password">
    <button class="btn btn-primary" onclick="changePw('app')">Update App Password</button>
    <div class="msg" id="app-msg"></div>
  </div>

  <div class="section">
    <label>Admin Password</label>
    <input type="password" id="new-admin-pw" placeholder="New admin password" autocomplete="new-password">
    <button class="btn btn-primary" onclick="changePw('admin')">Update Admin Password</button>
    <div class="msg" id="admin-msg"></div>
  </div>

  <a href="/" class="back">← Back to planner</a>
</div>

<script>
let cookie = '';

async function doAuth() {
  const pw = document.getElementById('auth-pw').value;
  const r = await fetch('/api/admin-login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  if (r.ok) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('pw-screen').style.display = 'block';
  } else {
    document.getElementById('auth-err').textContent = 'Incorrect admin password.';
  }
}

async function changePw(type) {
  const val = document.getElementById(type === 'app' ? 'new-app-pw' : 'new-admin-pw').value;
  const msgEl = document.getElementById(type === 'app' ? 'app-msg' : 'admin-msg');
  if (!val || val.length < 4) { msgEl.style.color = 'var(--danger)'; msgEl.textContent = 'Password must be at least 4 characters.'; return; }
  const r = await fetch('/api/admin/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, newPassword: val })
  });
  if (r.ok) {
    msgEl.style.color = 'var(--accent)';
    msgEl.textContent = 'Password updated.';
    document.getElementById(type === 'app' ? 'new-app-pw' : 'new-admin-pw').value = '';
    setTimeout(() => msgEl.textContent = '', 3000);
  } else {
    msgEl.style.color = 'var(--danger)';
    msgEl.textContent = 'Update failed. Try again.';
  }
}

document.getElementById('auth-pw').focus();
</script>
</body>
</html>
